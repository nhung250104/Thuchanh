<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lãi ngân hàng</title>
</head>
<body>
    <h3>Nhập số tiền đầu vào</h3>
    <script>
        let tien = parseFloat(prompt("Nhập số tiền bạn muốn gửi vào ngân hàng:"));
        let lai = parseFloat(prompt("Nhập lãi suất hàng năm: "));
        let thang = parseInt(prompt("Nhập số tháng bạn muốn gửi tiền:"));
    </script>
</body>
</html>
